<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رادار ژیروسکوپ</title>
<style>
:root{--bg:#0d1020;--card:#151a2e;--line:#2a3150;--tx:#ebe8df;--mut:#9ca3bb;--gold:#d9b45b;--up:#43b985;--dn:#e8645d;--warn:#e0a53a;--ink:#17130a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.9;padding:12px 16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:21px;color:var(--gold);margin:8px 0 2px}
h2{font-size:16px;color:var(--gold);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--mut);font-weight:400}
td:first-child,th:first-child{text-align:right}
.tw{overflow-x:auto}
.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--warn)}
.verdict{border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-weight:600}
.v-g{background:#12301f;border:1px solid #1f6b43}
.v-y{background:#33280f;border:1px solid #7a5d1c}
.v-r{background:#34171a;border:1px solid #84333a}
canvas{width:100%;height:230px;display:block}
#log div{font-size:13px;color:var(--mut)}
button{background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;font-family:inherit}
#hero{position:relative;height:330px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#02040a;margin:12px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;color:var(--mut);margin-inline-start:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>رادار ژیروسکوپ</h1>
<div class="mut">فقط آنچه در آزمون واقعی کار کرد، به‌عنوان قاعده؛ بقیه فقط اطلاعات. این پیش‌بینی نیست.</div>
<div id="hero"><canvas id="gl"></canvas><canvas id="fx"></canvas></div>
<div id="siren"></div>
<div style="margin:10px 0"><button id="go">به‌روزرسانی</button></div>
<div id="log"></div>
<div id="out"></div>
</div>
<script src="scene.js?v=27"></script>
<script src="siren.js?v=28"></script>
<script>
const COINS = ['BTC', 'ETH', 'BNB', 'SUI'];
const $ = (id) => document.getElementById(id);
const log = (m, c) => { const d = document.createElement('div'); d.textContent = m; if (c) d.className = c; $('log').appendChild(d); };
const dstr = (sec) => new Date(sec * 1000).toISOString().slice(0, 10);
const pct = (x, d) => (isFinite(x) ? (x * 100).toFixed(d == null ? 0 : d) + '٪' : '—');
const usd = (x) => !isFinite(x) ? '—' : x >= 1e9 ? (x / 1e9).toFixed(2) + ' میلیارد$' : (x / 1e6).toFixed(0) + ' میلیون$';

async function getJSON(url) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 30000);
  try { const r = await fetch(url, { signal: ac.signal }); if (!r.ok) throw new Error(url.split('?')[0] + ' → HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

// ---------- math ----------
function smaArr(a, n) { const o = new Float64Array(a.length).fill(NaN); let s = 0; for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i - n]; if (i >= n - 1) o[i] = s / n; } return o; }
function stdRoll(r, n) {
  const o = new Float64Array(r.length).fill(NaN);
  for (let i = n; i < r.length; i++) { let m = 0; for (let j = i - n + 1; j <= i; j++) m += r[j]; m /= n; let v = 0; for (let j = i - n + 1; j <= i; j++) v += (r[j] - m) ** 2; o[i] = Math.sqrt(v / (n - 1)); }
  return o;
}
// percentile of x[i] among x[0..i-1] (expanding, no look-ahead); NaN until minp valid points
function expPct(x, minp) {
  const o = new Float64Array(x.length).fill(NaN), seen = [];
  for (let i = 0; i < x.length; i++) {
    if (!isFinite(x[i])) continue;
    if (seen.length >= minp) { let c = 0; for (let k = 0; k < seen.length; k++) if (seen[k] < x[i]) c++; o[i] = c / seen.length; }
    seen.push(x[i]);
  }
  return o;
}
function zigzag(c, thr) {
  const p = []; let dir = 0, hi = 0, lo = 0;
  for (let i = 1; i < c.length; i++) {
    if (c[i] > c[hi]) hi = i; if (c[i] < c[lo]) lo = i;
    if (dir >= 0 && c[i] <= c[hi] * (1 - thr)) { p.push({ i: hi, t: 'H' }); dir = -1; lo = i; hi = i; }
    else if (dir <= 0 && c[i] >= c[lo] * (1 + thr)) { p.push({ i: lo, t: 'L' }); dir = 1; hi = i; lo = i; }
  }
  return p;
}

// ---------- data ----------
function dayMap(j, pick) {  // coinalyze json -> {BTC: Map(day -> value)}
  const out = {};
  for (const s of (j && j.data) || []) {
    const b = String(s.symbol).split(/USDT|USD/)[0]; if (!COINS.includes(b)) continue;
    const m = (out[b] = new Map());
    for (const x of s.history || []) { const v = pick(x); if (v != null && isFinite(v)) m.set(Math.floor(x.t / 86400), v); }
  }
  return out;
}
function buildSeries(sym, oh, price, todayDay) {
  const s = (oh.data || []).find((x) => String(x.symbol).startsWith(sym));
  if (!s) return null;
  const rows = [];
  if (sym === 'BTC' && price) {
    const first = Math.floor(s.history[0].t / 86400);
    for (const r of price.rows) { const dd = Math.floor(r[0] / 86400); if (dd < first) rows.push({ d: dd, c: r[1] }); }
  }
  for (const x of s.history) { const dd = Math.floor(x.t / 86400); if (dd < todayDay) rows.push({ d: dd, c: x.c }); }
  rows.sort((a, b) => a.d - b.d);
  // fill single-day gaps by carrying close forward so rolling windows stay aligned
  const out = [];
  for (const r of rows) { while (out.length && r.d - out[out.length - 1].d > 1 && r.d - out[out.length - 1].d < 6) out.push({ d: out[out.length - 1].d + 1, c: out[out.length - 1].c }); out.push(r); }
  return { d: out.map((x) => x.d), c: out.map((x) => x.c) };
}
function lastMean(m, endDay, n) { let s = 0, k = 0; for (let i = 0; i < n; i++) { const v = m && m.get(endDay - i); if (v != null) { s += v; k++; } } return k >= Math.ceil(n * 0.7) ? s / k : NaN; }

function coinState(sym, S, aux) {
  const n = S.c.length, c = S.c, last = n - 1, endDay = S.d[last];
  const sma = smaArr(c, 150), dist = new Float64Array(n).fill(NaN), r = new Float64Array(n).fill(NaN);
  for (let i = 0; i < n; i++) { if (isFinite(sma[i])) dist[i] = Math.log(c[i] / sma[i]); if (i) r[i] = Math.log(c[i] / c[i - 1]); }
  const vol = stdRoll(r, 30);
  const pd = expPct(dist, 365), pv = expPct(vol, 365);
  const score = (isFinite(pd[last]) && isFinite(pv[last])) ? (pd[last] + pv[last]) / 2 : NaN;
  const above = c[last] > sma[last];
  const expo = !above ? 0 : isFinite(score) ? 1 - Math.min(1, Math.max(0, (score - 0.6) / 0.3)) : 1;
  // liquidation sums
  const L = aux.liq[sym], sumL = (n_) => { let l = 0, s = 0, k = 0; for (let i = 0; i < n_; i++) { const v = L && L.get(endDay - i); if (v) { l += v.l; s += v.s; k++; } } return k >= n_ * 0.8 ? { l, s, share: l / (l + s) } : null; };
  const o = aux.oi[sym], oiNow = o && o.get(endDay), oi30 = o && o.get(endDay - 30);
  return {
    sym, last, endDay, close: c[last], dist: dist[last], above, pd: pd[last], pv: pv[last], score, expo,
    liq15: sumL(15), liq30: sumL(30),
    lsr: lastMean(aux.lsr[sym], endDay, 7), fund: lastMean(aux.fund[sym], endDay, 7),
    oi30: oiNow && oi30 ? Math.log(oiNow / oi30) : NaN, c, sma, dist_arr: dist,
  };
}

function coinCard(st) {
  let cls, txt;
  if (!st.above) { cls = 'v-r'; txt = 'قرمز: زیر میانگین ۱۵۰ روزه. طبق قانونِ آزمون‌شده، بیرون از بازار.'; }
  else if (st.expo < 1) { cls = 'v-y'; txt = 'زرد: بالای روند ولی داغ. طبق قاعدهٔ آزمون‌شده، حدود ' + Math.round(st.expo * 100) + '٪ در بازار.'; }
  else { cls = 'v-g'; txt = 'سبز: بالای میانگین ۱۵۰ روزه و بدون داغی. در بازار.'; }
  const row = (a, b, tag) => '<tr><td>' + a + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</td><td>' + b + '</td></tr>';
  const lq = st.liq15 ? usd(st.liq15.l) + ' لانگ / ' + usd(st.liq15.s) + ' شورت (سهم لانگ ' + pct(st.liq15.share) + ')' : '—';
  const lq30 = st.liq30 ? 'سهم لانگ ' + pct(st.liq30.share) : '—';
  return '<div class="card"><h2>' + st.sym + ' <span class="mut">' + st.close.toLocaleString('en-US', { maximumFractionDigits: st.close < 10 ? 3 : 0 }) + ' دلار · ' + dstr(st.endDay * 86400) + '</span></h2>' +
    '<div class="verdict ' + cls + '">' + txt + '</div>' +
    '<div class="tw"><table><tr><th>شاخص</th><th>امروز</th></tr>' +
    row('فاصله از میانگین ۱۵۰ روزه', pct(Math.exp(st.dist) - 1), 'قاعده') +
    row('داغی (صدکِ فاصله و نوسان نسبت به تاریخ خودش)', isFinite(st.score) ? Math.round(st.score * 100) + 'ام' : '—', 'قاعده') +
    row('لیکویید ۱۵ روز', lq, 'اطلاعاتی') +
    row('لیکویید ۳۰ روز', lq30, 'اطلاعاتی') +
    row('سهم حساب‌های لانگ (میانگین ۷ روز)', isFinite(st.lsr) ? st.lsr.toFixed(0) + '٪' : '—', 'اطلاعاتی') +
    row('تغییر Open Interest در ۳۰ روز', isFinite(st.oi30) ? pct(Math.exp(st.oi30) - 1) : '—', 'اطلاعاتی') +
    row('Funding (میانگین ۷ روز)', isFinite(st.fund) ? st.fund.toFixed(4) + '٪' : '—', 'اطلاعاتی') +
    '</table></div></div>';
}

function swingCard(S) {
  const c = S.c, sma = smaArr(c, 150), n = c.length;
  const p = zigzag(c, 0.30), rows = [], segs = [], avs = [], caps = [];
  for (let k = 0; k + 1 < p.length; k++) {
    const a = p[k], b = p[k + 1], mv = c[b.i] / c[a.i] - 1, down = b.t === 'L';
    if (a.i < 200 || S.d[a.i] < 15706) continue;   // from 2013 on: the market was very thin before
    if (down && mv > -0.4) continue; if (!down && mv < 1.0) continue;
    let ty = '', t30 = -1;
    if (down) { for (let i = a.i; i <= b.i; i++) if (c[i] <= c[a.i] * 0.7) { t30 = i - a.i; break; } ty = t30 <= 14 ? 'N' : t30 <= 60 ? 'M' : 'A'; }
    segs.push({ from: a.i, to: b.i, down, ty, t30 });
    let txt;
    if (down) {
      let e = -1; for (let i = a.i + 1; i <= b.i; i++) if (c[i] < sma[i]) { e = i; break; }
      if (e < 0) { txt = 'قانون روند پیش از کف خارج نشد'; avs.push(0); }
      else { const lossTaken = c[e] / c[a.i] - 1, avoided = 1 - lossTaken / mv; avs.push(Math.max(0, avoided)); txt = 'خروج ' + (e - a.i) + ' روز بعد، در افت ' + pct(lossTaken) + '؛ ' + pct(Math.max(0, avoided)) + ' سقوط در امان'; }
    } else {
      let e = -1; for (let i = a.i; i <= b.i; i++) if (c[i] > sma[i]) { e = i; break; }
      if (c[a.i] > sma[a.i]) { txt = 'قانون از قبل داخل بود (این فقط یک اصلاح میانهٔ روند صعودی بود، ورود تازه نبود)'; }
      else if (e < 0) { txt = '—'; caps.push(0); }
      else { const cap = Math.log(c[b.i] / c[e]) / Math.log(c[b.i] / c[a.i]); caps.push(Math.max(0, cap)); txt = 'ورود ' + (e - a.i) + ' روز بعد؛ ' + pct(Math.max(0, cap)) + ' صعود (لگاریتمی) گرفته شد'; }
    }
    rows.push('<tr><td>' + dstr(S.d[a.i] * 86400) + '</td><td class="' + (down ? 'dn' : 'up') + '">' + (down ? 'سقوط ' : 'صعود ') + pct(mv) + (down ? '<br><span class="mut">' + ({ N: 'ناگهانی', M: 'میانه', A: 'آرام' })[ty] + ': ' + t30 + ' روز تا ۳۰٪ افت</span>' : '') + '</td><td style="text-align:right">' + txt + '</td></tr>');
  }
  const med = (a) => { if (!a.length) return NaN; const b = a.slice().sort((x, y) => x - y); return b[Math.floor((b.length - 1) / 2)]; };
  window.__segs = segs; window.__S = S;
  return '<div class="card"><h2>نقشهٔ بیت‌کوین از ' + dstr(S.d[0] * 86400) + '</h2><canvas id="cv"></canvas><div class="mut">قرمز = سقوط بیش از ۴۰٪، سبز = صعود بیش از ۱۰۰٪. مقیاس لگاریتمی.<br>نقطهٔ زرد = قلهٔ هر چرخه، خط‌چین عمودی = مرز چرخه.<br>نوع سقوط بر پایهٔ سرعت، نقطه روی هر قله: <b style="color:#ff3b30">قرمز = ناگهانی</b> (۳۰٪ افت در ۱۴ روز یا کمتر)، <b style="color:#ffb020">نارنجی = میانه</b> (۱۵ تا ۶۰ روز)، <b style="color:#4aa3ff">آبی = آرام</b> (بیش از ۶۰ روز).</div></div>' +
    todayTypeCard(S) + parabolaCard(S) +
    '<div class="card"><h2>فیبوناچی چرخهٔ فعلی</h2><canvas id="cv2"></canvas><div class="mut">از کف ۲۰۲۲ تا قلهٔ ۲۰۲۵. فیبوناچی اینجا نقشه و نماد است، نه سیگنال خرید و فروش؛ در سه چرخهٔ قبل کف‌ها روی ۰٫۶۱۸ نایستادند.</div></div>' +
    '<div class="card"><h2>قانون میانگین ۱۵۰ روزه در هر سقوط و صعود</h2><div class="tw"><table><tr><th>آغاز</th><th>حرکت</th><th>نتیجهٔ قانون</th></tr>' + rows.join('') + '</table></div>' +
    '<div style="margin-top:8px">از ' + avs.length + ' سقوط بیش از ۴۰٪ از سال ۲۰۱۳، میانهٔ سهم سقوطی که با قانون در امان ماند: ' + pct(med(avs)) + '. از ' + caps.length + ' صعودی که قانون واقعاً از بیرون وارد آن شد، میانهٔ سهم صعودی که گرفته شد: ' + pct(med(caps)) + '.</div><div class="mut" style="margin-top:6px">خروج یعنی نخستین روزی که قیمت از میانگین ۱۵۰ روزه پایین‌تر بسته شد. «در امان» یعنی چه بخشی از سقوط بعد از خروج رخ داد. کارمزد و لغزش قیمت را حساب نکرده‌ام.</div></div>';
}
function mvrvCard(S, oc) {
  if (!oc) return '';
  const ci = oc.cols.indexOf('CapMVRVCur'); if (ci < 0) return '';
  let last = null; for (let k = oc.rows.length - 1; k >= 0; k--) if (oc.rows[k][ci] != null) { last = oc.rows[k]; break; }
  if (!last) return '';
  const day = Math.floor(last[0] / 86400), n = S.c.length; let ix = -1; for (let i = n - 1; i >= 0; i--) if (S.d[i] <= day) { ix = i; break; }
  if (ix < 0) return '';
  const mv = last[ci], rp = S.c[ix] / mv; window.__rp = rp; const est = S.c[n - 1] / rp, f = (x) => Math.round(x).toLocaleString('en-US');
  const vd = est < 1 ? ['v-g', 'منطقهٔ کف تاریخی: بازار زیر قیمت خرید دارندگان'] : est < 1.5 ? ['v-y', 'نزدیک کف، ولی هنوز به زیر ۱ نرسیده'] : est < 3 ? ['v-y', 'میانه'] : ['v-r', 'منطقهٔ داغ (قله‌های قبلی بالای ۳)'];
  return '<div class="card"><h2>ارزش: MVRV بیت‌کوین</h2>' +
    '<div class="' + vd[0] + '" style="font-weight:700;font-size:18px">تخمین امروز ≈ ' + est.toFixed(2) + ' — ' + vd[1] + '</div>' +
    '<div class="tw"><table><tr><th>آخرین مقدار واقعی</th><td>' + mv.toFixed(2) + ' در ' + dstr(last[0]) + '</td></tr>' +
    '<tr><th>میانگین قیمت خرید دارندگان</th><td>≈ ' + f(rp) + ' دلار</td></tr>' +
    '<tr><th>قیمت ورود پله‌ای (طبق MVRV)</th><td>MVRV=۱ ← ' + f(rp) + '؛ ۰٫۸ ← ' + f(rp * 0.8) + '؛ ۰٫۷ ← ' + f(rp * 0.7) + '</td></tr>' +
    '<tr><th>کف‌های ۲۰۱۵ تا ۲۰۲۲</th><td>۰٫۵۶ تا ۰٫۸۸ (همیشه زیر ۱)</td></tr>' +
    '<tr><th>قله‌های ۲۰۱۳ تا ۲۰۲۱</th><td>۲٫۷ تا ۴٫۷</td></tr></table></div>' +
    '<div style="margin-top:8px"><b>آزمون کف:</b> در روزهای بازار نزولی عمیق (افت بیش از ۴۰٪ از سقف یک‌ساله)، احتمال اینکه «دیگر افت بزرگ تازه نیاید و ظرف ۶ ماه ۲۰٪ بالا برود» به‌طور پایه ۲۴٪ است. MVRV زیر ۱: ۴۸٪. MVRV زیر ۰٫۸: ۷۴٪ (۵ دوره). RSI زیر ۲۰: فقط ۱۸٪، یعنی از شانس هم بدتر. اندیکاتورهای قیمتی کف را نشان نمی‌دهند؛ ارزش (MVRV) نشان می‌دهد.</div><div class="mut" style="margin-top:6px">داده‌ی MVRV منبع رایگان است و فقط تا ' + dstr(last[0]) + ' آمده؛ عدد امروز تخمین است (قیمت امروز تقسیم بر میانگین قیمت خرید آن روز، که آهسته تغییر می‌کند). قیمت زیر ≈ ' + f(rp) + ' یعنی MVRV زیر ۱. در آزمون: وقتی MVRV زیر ۱ بود، ۱۸۰ روز بعد ۸۲٪ دفعات مثبت؛ ولی اگر فروش در MVRV بالای ۳ را به قانون روند اضافه کنیم، افت بدترین از ۶۳٪ به ۵۴٪ می‌رسد و رشد سالانه از ۶۶٪ به ۵۸٪ می‌افتد.</div></div>';
}
function todayTypeCard(S) {
  const c = S.c, n = c.length; let a = -1; for (let i = 0; i < n; i++) if (S.d[i] >= Date.UTC(2024, 0, 1) / 86400000 && (a < 0 || c[i] > c[a])) a = i;
  if (a < 0) return '';
  let t30 = -1; for (let i = a; i < n; i++) if (c[i] <= c[a] * 0.7) { t30 = i - a; break; }
  const dd = c[n - 1] / c[a] - 1, ty = t30 < 0 ? '' : t30 <= 14 ? 'ناگهانی' : t30 <= 60 ? 'میانه' : 'آرام';
  const cnt = { N: 0, M: 0, A: 0 }; for (const sg of window.__segs) if (sg.down) cnt[sg.ty]++;
  return '<div class="card"><h2>سقوط امروز کدام نوع است؟</h2><div style="font-weight:700;font-size:18px">' + (ty ? 'نوع ' + ty + ': ' + t30 + ' روز بعد از قله به ۳۰٪ افت رسید' : 'هنوز به ۳۰٪ افت از قله نرسیده') + '</div>' +
