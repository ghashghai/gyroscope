name: Update market data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'   # backup: GitHub often delays or skips scheduled runs (measured gaps up to 15 h with a single cron)
  push:
    paths:
      - '.github/workflows/liq.yml'
      - 'scripts/fetch.py'
      - 'scripts/whale.py'
      - 'scripts/macro.py'
      - 'scripts/macro_test.py'
      - 'scripts/regime.py'
      - 'scripts/ledger.py'
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        env:
          KEY: 322170a1-8172-4349-83cd-7fca61183feb
        run: python3 scripts/fetch.py
      - name: Macro liquidity
        continue-on-error: true
        run: python3 scripts/macro.py
      - name: Macro test (stablecoins, dollar, yields, TGA, RRP vs BTC)
        continue-on-error: true
        run: python3 scripts/macro_test.py > /dev/null
      - name: Whale watch
        continue-on-error: true
        run: python3 scripts/whale.py
      - name: Regime timeline
        continue-on-error: true
        run: python3 scripts/regime.py
      - name: Ledger
        continue-on-error: true
        run: python3 scripts/ledger.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update market data"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
