name: Update liquidation data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/liq.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Coinalyze liquidations
        env:
          KEY: 322170a1-8172-4349-83cd-7fca61183feb
        run: |
          NOW=$(date +%s)
          SYMS="BTCUSDT_PERP.A,ETHUSDT_PERP.A,BNBUSDT_PERP.A,SUIUSDT_PERP.A"
          curl -fsS --retry 3 --retry-delay 10 \
            "https://api.coinalyze.net/v1/liquidation-history?symbols=${SYMS}&interval=daily&from=1546300800&to=${NOW}&convert_to_usd=true&api_key=${KEY}" \
            -o raw.json
          python3 - <<'PY'
          import json, time
          d = json.load(open('raw.json'))
          assert isinstance(d, list) and len(d) > 0, 'bad response'
          json.dump({'fetched': int(time.time()), 'data': d}, open('liq.json', 'w'))
          PY
          rm raw.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add liq.json
          git diff --cached --quiet || git commit -m "Update liquidation data"
          git push
