name: Update market data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/liq.yml'
      - 'scripts/fetch.py'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        env:
          KEY: 322170a1-8172-4349-83cd-7fca61183feb
        run: python3 scripts/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add liq.json oi.json funding.json lsr.json price.json meta.json
          git diff --cached --quiet || git commit -m "Update market data"
          git pull --rebase -q origin main || true
          git push
